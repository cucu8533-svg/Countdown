<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>365カウントダウン</title>
    <style>
        body {
            text-align: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding-top: 60px;
            background-color: #f5f5f7;
            color: #333;
        }
        h1 { font-size: 24px; color: #1d1d1f; }
        #display {
            font-size: 90px;
            font-weight: bold;
            margin: 40px 0;
            color: #007AFF;
        }
        #down {
            font-size: 22px;
            font-weight: bold;
            padding: 18px 60px;
            background-color: #007AFF;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,122,255,0.3);
            width: 80%;
            max-width: 300px;
        }
        #down:disabled {
            background-color: #aeaeae;
            box-shadow: none;
        }
        #message {
            font-size: 15px;
            color: #ff3b30;
            margin-top: 25px;
            padding: 0 20px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h1>365カウントダウン</h1>
    <div id="display">---</div>
    <button id="down">押す</button>
    <p id="message"></p>

    <script>
        let savedCount = localStorage.getItem('dailyCountValue');
        let count = savedCount ? parseInt(savedCount, 10) : 365;

        const display = document.getElementById('display');
        const downButton = document.getElementById('down');
        const message = document.getElementById('message');

        function getTodayString() {
            const today = new Date();
            return `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
        }

        function updateApp() {
            display.textContent = count;
            localStorage.setItem('dailyCountValue', count);
            
            const lastPressedDate = localStorage.getItem('lastPressedDate');
            const todayStr = getTodayString();
            
            if (lastPressedDate === todayStr) {
                downButton.disabled = true;
                message.textContent = "本日のカウントダウンは終了しました。また明日！";
            } else {
                downButton.disabled = false;
                message.textContent = "";
            }
        }

        updateApp();

        downButton.addEventListener('click', () => {
            if (count > 0) {
                count--; 
                localStorage.setItem('lastPressedDate', getTodayString());
                updateApp(); 
            }
            if (count === 0) {
                setTimeout(() => { alert('365日達成！おめでとうございます！'); }, 10);
            }
        });
    </script>
</body>
</html>
